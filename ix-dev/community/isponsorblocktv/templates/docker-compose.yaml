{% set tpl = ix_lib.base.render.Render(values) %}
{% set worker = tpl.add_container(values.consts.worker_container_name, "image") %}
{% set dashboard = tpl.add_container(values.consts.dashboard_container_name, "dashboard_image") %}
{% set permissions = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% for container in [worker, dashboard] %}
  {% do container.set_user(values.run_as.user, values.run_as.group) %}
  {% do container.set_read_only(true) %}
  {% do container.healthcheck.use_built_in() %}
  {% do container.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 64}}) %}
  {% do container.add_storage("/app/data", values.storage.config) %}
{% endfor %}

{% do dashboard.environment.add_env("DASHBOARD_USERNAME", values.isponsorblocktv.username) %}
{% do dashboard.environment.add_env("DASHBOARD_PASSWORD", values.isponsorblocktv.password) %}
{% do dashboard.add_port(values.network.web_port, {"container_port": 8080}) %}
{% do tpl.portals.add(values.network.web_port) %}

{% do permissions.add_or_skip_action("config", values.storage.config, perms_config) %}
{% if permissions.has_actions() %}
  {% do permissions.activate() %}
  {% for container in [worker, dashboard] %}
    {% do container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% endfor %}
{% endif %}

{{ tpl.render() | tojson }}
