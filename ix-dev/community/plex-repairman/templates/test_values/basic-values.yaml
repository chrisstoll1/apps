resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: America/New_York
plex_repairman:
  log_level: info
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 31080

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/plex-repairman/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  additional_storage: []

labels: []
